<!doctype html>
<!-- Marketing video editor (2026-10-04). Plays a timeline (window.TIMELINE, set by tests/browser/promo-compose.mjs) onto a
     1080x1920 canvas with music made right here (Web Audio: nothing licensed, nothing downloaded) and the browser records it.
     Segments: card (solid colour + lines of text), clip (a video, cover-fit, fades, slow zoom, a label).
     Overlays: text drawn over whatever is playing. Music: bells, drone, riser, hits, a beat, all on the timeline's clock. -->
<html><head><meta charset="utf-8"><title>Compose</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@600;800&family=Alegreya+Sans:wght@500;700;800&family=Silkscreen:wght@400;700&display=swap">
<style>html,body{margin:0;background:#000}canvas{width:405px;height:720px;display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920, c = document.getElementById('c'), g = c.getContext('2d');
const COL = { ink: '#0c0f1a', night: '#121830', plaque: '#1b2344', frost: '#b9cdf2', text: '#eef2fb', hat: '#cf3128', lit: '#ff7a66', lamp: '#ffbe5c', brim: '#f5f1e8', pine: '#7fe0a0' };
const FONT = { display: "'Grenze Gotisch', Georgia, serif", body: "'Alegreya Sans', sans-serif", pixel: "'Silkscreen', monospace" };
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), ease = (x) => x * x * (3 - 2 * x);

// ---------- music: everything synthesized on the timeline clock (t = seconds from the start)
function music(ac, out, M, T0) {
  // mix → glue compressor → loudness (M.volume) → limiter → soft clip → out. The first cut peaked at 1.69 (crackle on the
  // hits) while sitting at about -21 dB (too quiet, Cody: "can't really hear it"); the limiter lets the whole mix be loud.
  const at = (t) => T0 + t, master = ac.createGain(); master.gain.value = M.volume ?? 1.15;
  const limit = ac.createDynamicsCompressor(); limit.threshold.value = -4; limit.knee.value = 0; limit.ratio.value = 20; limit.attack.value = 0.001; limit.release.value = 0.12;
  const clip = ac.createWaveShaper(), curve = new Float32Array(2049); for (let i = 0; i < 2049; i++) { const x = (i - 1024) / 1024 * 2; curve[i] = Math.tanh(x) * 0.97; } clip.curve = curve;
  master.connect(limit); limit.connect(clip); clip.connect(out); music.input = limit; // clips' own sound joins at the limiter
  const comp = ac.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 3; comp.connect(master);
  const bus = comp, rev = ac.createConvolver(), rl = ac.sampleRate * 2.2, ir = ac.createBuffer(2, rl, ac.sampleRate);
  for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < rl; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / rl) ** 2.6; }
  rev.buffer = ir; const revG = ac.createGain(); revG.gain.value = 0.32; rev.connect(revG); revG.connect(bus);
  const noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate); { const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const noise = (t, dur) => { const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true; s.start(at(t)); s.stop(at(t + dur + 0.1)); return s; };
  const hz = (m) => 440 * 2 ** ((m - 69) / 12);
  const env = (node, t, a, peak, d, end) => { const p = node.gain; p.setValueAtTime(0.0001, at(t)); p.exponentialRampToValueAtTime(peak, at(t + a)); p.exponentialRampToValueAtTime(0.0001, at(t + a + d)); return end; };
  const bell = (t, m, v = 0.18) => { for (const [mul, amp] of [[1, 1], [2.76, 0.5], [5.4, 0.25], [8.93, 0.12]]) { const o = ac.createOscillator(), gn = ac.createGain(); o.type = 'sine'; o.frequency.value = hz(m) * mul;
      o.connect(gn); gn.connect(bus); gn.connect(rev); env(gn, t, 0.005, v * amp, 1.6 / mul ** 0.4); o.start(at(t)); o.stop(at(t + 2)); } };
  const kick = (t, v = 0.9) => { const o = ac.createOscillator(), gn = ac.createGain(); o.frequency.setValueAtTime(150, at(t)); o.frequency.exponentialRampToValueAtTime(42, at(t + 0.18));
    o.connect(gn); gn.connect(bus); env(gn, t, 0.003, v, 0.42); o.start(at(t)); o.stop(at(t + 0.6)); };
  const snare = (t, v = 0.35) => { const s = noise(t, 0.25), f = ac.createBiquadFilter(), gn = ac.createGain(); f.type = 'bandpass'; f.frequency.value = 1900; f.Q.value = 0.8;
    s.connect(f); f.connect(gn); gn.connect(bus); gn.connect(rev); env(gn, t, 0.002, v, 0.18); };
  const hat = (t, v = 0.08) => { const s = noise(t, 0.08), f = ac.createBiquadFilter(), gn = ac.createGain(); f.type = 'highpass'; f.frequency.value = 7500; s.connect(f); f.connect(gn); gn.connect(bus); env(gn, t, 0.001, v, 0.05); };
  const boom = (t, v = 1) => { kick(t, v); const o = ac.createOscillator(), gn = ac.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(70, at(t)); o.frequency.exponentialRampToValueAtTime(30, at(t + 1.8));
      o.connect(gn); gn.connect(bus); env(gn, t, 0.01, v * 0.8, 2.2); o.start(at(t)); o.stop(at(t + 2.5));
    const s = noise(t, 2.5), f = ac.createBiquadFilter(), g2 = ac.createGain(); f.type = 'highpass'; f.frequency.value = 3000; s.connect(f); f.connect(g2); g2.connect(bus); g2.connect(rev); env(g2, t, 0.005, v * 0.22, 2.3); };
  const swoosh = (t, dur, v = 0.25) => { const s = noise(t, dur), f = ac.createBiquadFilter(), gn = ac.createGain(); f.type = 'bandpass'; f.Q.value = 2;
    f.frequency.setValueAtTime(300, at(t)); f.frequency.exponentialRampToValueAtTime(6000, at(t + dur)); s.connect(f); f.connect(gn); gn.connect(bus); gn.connect(rev);
    gn.gain.setValueAtTime(0.0001, at(t)); gn.gain.exponentialRampToValueAtTime(v, at(t + dur)); gn.gain.exponentialRampToValueAtTime(0.0001, at(t + dur + 0.08)); };
  // pad: a minor chord whose loudness, brightness and pitch climb across [t0, t1]
  const pad = (t0, t1, root, v = 0.07, climb = 0) => { const f = ac.createBiquadFilter(), gn = ac.createGain(); f.type = 'lowpass'; f.frequency.setValueAtTime(400, at(t0)); f.frequency.exponentialRampToValueAtTime(5200, at(t1));
    f.connect(gn); gn.connect(bus); gn.connect(rev); gn.gain.setValueAtTime(0.0001, at(t0)); gn.gain.exponentialRampToValueAtTime(v, at(t1 - 0.05)); gn.gain.exponentialRampToValueAtTime(0.0001, at(t1 + 0.12));
    for (const iv of [0, 3, 7, 12, 15]) for (const det of [-6, 6]) { const o = ac.createOscillator(); o.type = 'sawtooth'; o.detune.value = det; o.frequency.setValueAtTime(hz(root + iv), at(t0));
      if (climb) o.frequency.exponentialRampToValueAtTime(hz(root + iv + climb), at(t1)); o.connect(f); o.start(at(t0)); o.stop(at(t1 + 0.2)); } };
  const drone = (t0, t1, m, v = 0.12) => { const o = ac.createOscillator(), gn = ac.createGain(); o.type = 'triangle'; o.frequency.value = hz(m); o.connect(gn); gn.connect(bus);
    gn.gain.setValueAtTime(0.0001, at(t0)); gn.gain.exponentialRampToValueAtTime(v, at(t0 + 0.8)); gn.gain.setValueAtTime(v, at(t1 - 0.3)); gn.gain.exponentialRampToValueAtTime(0.0001, at(t1)); o.start(at(t0)); o.stop(at(t1 + 0.1)); };
  const bass = (t, m, dur, v = 0.22) => { const o = ac.createOscillator(), f = ac.createBiquadFilter(), gn = ac.createGain(); o.type = 'sawtooth'; o.frequency.value = hz(m); f.type = 'lowpass'; f.frequency.value = 700;
    o.connect(f); f.connect(gn); gn.connect(bus); env(gn, t, 0.01, v, dur); o.start(at(t)); o.stop(at(t + dur + 0.1)); };
  // pluck: a plucked string (pizzicato) — the waltz's bass and chords and a warm melody voice
  const pluck = (t, m, v = 0.2, dur = 0.4) => { const f = ac.createBiquadFilter(), gn = ac.createGain(); f.type = 'lowpass'; f.frequency.setValueAtTime(3200, at(t)); f.frequency.exponentialRampToValueAtTime(500, at(t + dur));
    f.connect(gn); gn.connect(bus); gn.connect(rev); env(gn, t, 0.004, v, dur);
    for (const [type, mul, amp] of [['triangle', 1, 1], ['sawtooth', 1, 0.35], ['sine', 2, 0.25]]) { const o = ac.createOscillator(), og = ac.createGain(); o.type = type; o.frequency.value = hz(m) * mul; og.gain.value = amp; o.connect(og); og.connect(f); o.start(at(t)); o.stop(at(t + dur + 0.1)); } };
  // sleigh bells: a shaken cluster of tiny high rings
  const jingle = (t, v = 0.06) => { for (let k = 0; k < 3; k++) { const s = noise(t + k * 0.012, 0.12), f = ac.createBiquadFilter(), gn = ac.createGain(); f.type = 'bandpass'; f.frequency.value = 6500 + k * 1700; f.Q.value = 9;
    s.connect(f); f.connect(gn); gn.connect(bus); gn.connect(rev); env(gn, t + k * 0.012, 0.002, v, 0.1); } };
  const THIRD = { m: 3, M: 4 };
  const beat = 60 / M.bpm;
  for (const p of M.parts) {
    // waltz: one chord per bar of 3 — bass on 1, the chord plucked on 2 and 3. chords: [[root, 'm'|'M'], ...]
    if (p.waltz) p.chords.forEach(([r, q], i) => { const t = p.t + i * 3 * beat, c = [r + THIRD[q], r + 7, r + 12];
      pluck(t, r - 12, p.v ?? 0.24, beat * 1.4); for (const b of [1, 2]) c.forEach((m) => pluck(t + b * beat, m, (p.v ?? 0.24) * 0.38, beat * 0.8)); });
    // melody: [[note, beats], ...] (note null = a rest) on a bell (music box) or a pluck
    if (p.melody) { let t = p.t; for (const [m, b] of p.notes) { if (m != null) (p.inst === 'pluck' ? pluck(t, m, p.v ?? 0.18, beat * b * 0.95) : bell(t, m, p.v ?? 0.16)); t += b * beat; } }
    if (p.jingle) for (let t = p.t; t < p.end - 0.01; t += beat * (p.every ?? 1)) jingle(t, p.v ?? 0.06);
    if (p.chord) { const iv = p.quality === 'M' ? [0, 4, 7, 12, 16] : [0, 3, 7, 12, 15]; for (const i of iv) pluck(p.t, p.root + i, p.v ?? 0.12, p.dur ?? 2); }
    if (p.bells) p.notes.forEach((m, i) => bell(p.t + i * beat * (p.every ?? 1), m, p.v));
    if (p.drone) drone(p.t, p.end, p.note, p.v);
    if (p.pad) pad(p.t, p.end, p.root, p.v, p.climb);
    if (p.hit) { kick(p.t, p.v ?? 0.9); swoosh(p.t - 0.45, 0.45, 0.16); }
    if (p.pulse) for (let t = p.t; t < p.end - 0.01; t += beat * (p.every ?? 1)) kick(t, p.v ?? 0.45);
    if (p.roll) { let t = p.t, step = beat / 2; while (t < p.end - 0.02) { snare(t, 0.12 + 0.3 * (t - p.t) / (p.end - p.t)); step = Math.max(beat / 8, step * 0.86); t += step; } swoosh(p.end - 1.2, 1.2, 0.3); }
    if (p.boom) boom(p.t, p.v ?? 1);
    if (p.groove) { const seq = p.bass; let i = 0; for (let t = p.t; t < p.end - 0.01; t += beat / 2, i++) {
        if (i % 2 === 0) kick(t, 0.75); if (i % 4 === 2) snare(t, 0.32); hat(t + beat / 4, 0.07); if (seq) bass(t, seq[Math.floor(i / 2) % seq.length], beat / 2 * 0.9); } }
    if (p.stab) { pad(p.t, p.t + 0.6, p.root, p.v ?? 0.09, 0); }
  }
}

// ---------- drawing
function cover(img, iw, ih, zoom = 1, dx = 0, dy = 0) { const s = Math.max(W / iw, H / ih) * zoom, w = iw * s, h = ih * s; g.drawImage(img, (W - w) / 2 + dx, (H - h) / 2 + dy, w, h); }
function text(str, x, y, o = {}) {
  g.save(); g.font = `${o.weight ?? 800} ${o.size ?? 80}px ${FONT[o.font ?? 'display']}`; g.textAlign = o.align ?? 'center'; g.textBaseline = 'middle';
  if (o.spacing) g.letterSpacing = o.spacing + 'px';
  if (o.shadow !== false) { g.shadowColor = 'rgba(0,0,0,.7)'; g.shadowBlur = o.blur ?? 18; g.shadowOffsetY = 4; }
  if (o.stroke) { g.lineWidth = o.stroke; g.strokeStyle = COL.ink; g.lineJoin = 'round'; g.strokeText(str, x, y); }
  g.fillStyle = o.color ?? COL.text; g.fillText(str, x, y); g.restore();
}
function card(seg, lt) {
  g.fillStyle = seg.bg ?? COL.night; g.fillRect(0, 0, W, H);
  // the site's fur trim: a white scalloped band (the top bar's edge)
  if (seg.fur !== false) { g.fillStyle = COL.brim; for (const y of [seg.furTop ?? 210, seg.furBottom ?? 1700]) { g.fillRect(0, y - 14, W, 28); for (let x = 0; x <= W; x += 54) { g.beginPath(); g.arc(x, y + 14, 27, 0, Math.PI); g.fill(); } } }
  for (const l of seg.lines) { const k = clamp((lt - (l.at ?? 0)) / 0.25); if (k <= 0) continue; g.globalAlpha = k; text(l.text, W / 2, l.y, { ...l, y: undefined }); g.globalAlpha = 1; }
}
function vignette(a = 0.55) { const r = g.createRadialGradient(W / 2, H * 0.45, H * 0.25, W / 2, H / 2, H * 0.75); r.addColorStop(0, 'rgba(0,0,0,0)'); r.addColorStop(1, `rgba(0,0,0,${a})`); g.fillStyle = r; g.fillRect(0, 0, W, H); }

window.compose = async function (TL) {
  // every weight the timelines use, loaded before the first frame (a late font swapped mid-shot in the first cut)
  for (const f of ["800 80px 'Grenze Gotisch'", "600 80px 'Grenze Gotisch'", "700 40px 'Silkscreen'", "400 40px 'Silkscreen'", "800 40px 'Alegreya Sans'", "700 40px 'Alegreya Sans'", "500 40px 'Alegreya Sans'"]) await document.fonts.load(f);
  await document.fonts.ready;
  const { Muxer, ArrayBufferTarget } = await import('https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.2/build/mp4-muxer.mjs');
  const vids = {};
  for (const s of TL.segments) if (s.src && !vids[s.src]) { const v = document.createElement('video'); v.src = s.src; v.preload = 'auto'; v.playsInline = true; v.muted = true;
    await new Promise((r, j) => { v.oncanplaythrough = r; v.onerror = () => j(new Error('cannot load ' + s.src)); v.load(); }); vids[s.src] = v; }
  // a still picture (img: a sharp page screenshot) is framed like a clip: same zoom, fades and labels, nothing to play
  for (const s of TL.segments) if (s.img && !vids[s.img]) { const im = new Image(); im.src = s.img; await im.decode(); vids[s.img] = im; }
  for (const s of TL.segments) if (s.log) s._log = await (await fetch(s.log)).json();
  const FPS = 30, SR = 48000, total = TL.segments.reduce((m, s) => Math.max(m, s.t + s.dur), 0) + (TL.tail ?? 0.4);
  // ---- sound, made ahead of time on the same clock as the pictures: the music plus each clip's own sound (with its fades)
  const off = new OfflineAudioContext(2, Math.ceil(SR * total), SR);
  music(off, off.destination, TL.music, 0);
  for (const s of TL.segments) if (s.src && !s.mute) {
    const buf = await off.decodeAudioData(await (await fetch(s.src)).arrayBuffer()).catch(() => null); if (!buf) continue;
    const src = off.createBufferSource(), gn = off.createGain(), v = (s.volume ?? TL.clipVolume ?? 0.35), fi = s.fadeIn ?? 0.35, fo = s.fadeOut ?? 0.35;
    src.buffer = buf; src.connect(gn); gn.connect(music.input);
    gn.gain.setValueAtTime(0, s.t); gn.gain.linearRampToValueAtTime(v, s.t + fi); gn.gain.setValueAtTime(v, s.t + s.dur - fo); gn.gain.linearRampToValueAtTime(0, s.t + s.dur);
    src.start(s.t, s.from ?? 0, s.dur); }
  const audio = await off.startRendering();
  // loudness per second (dB of the RMS, 0 = full scale) and the peak, so a mix can be checked by numbers, not by ear
  const levels = []; { const L0 = audio.getChannelData(0); for (let s0 = 0; s0 < L0.length; s0 += SR) { let q = 0, n = 0; for (let i = s0; i < Math.min(L0.length, s0 + SR); i++) { q += L0[i] * L0[i]; n++; } levels.push(Math.round(10 * Math.log10(q / n + 1e-12))); } }
  let peak = 0; for (let ch = 0; ch < 2; ch++) for (const x of audio.getChannelData(ch)) peak = Math.max(peak, Math.abs(x));
  // ---- a standard MP4 (H.264 + AAC, index up front so every player knows the length)
  const target = new ArrayBufferTarget(), muxer = new Muxer({ target, fastStart: 'in-memory', firstTimestampBehavior: 'offset',
    video: { codec: 'avc', width: W, height: H, frameRate: FPS }, audio: { codec: 'aac', numberOfChannels: 2, sampleRate: SR } });
  let err = null;
  const venc = new VideoEncoder({ output: (c, m) => muxer.addVideoChunk(c, m), error: (e) => (err = e) });
  venc.configure({ codec: 'avc1.640028', width: W, height: H, bitrate: TL.bitrate ?? 9e6, framerate: FPS, avc: { format: 'avc' } });
  const aenc = new AudioEncoder({ output: (c, m) => muxer.addAudioChunk(c, m), error: (e) => (err = e) });
  aenc.configure({ codec: 'mp4a.40.2', sampleRate: SR, numberOfChannels: 2, bitrate: 192000 });
  const L = audio.getChannelData(0), R = audio.getChannelData(1), N = 1024;
  for (let i = 0; i < L.length; i += N) { const n = Math.min(N, L.length - i), d = new Float32Array(n * 2); d.set(L.subarray(i, i + n), 0); d.set(R.subarray(i, i + n), n);
    const ad = new AudioData({ format: 'f32-planar', sampleRate: SR, numberOfFrames: n, numberOfChannels: 2, timestamp: Math.round((i / SR) * 1e6), data: d }); aenc.encode(ad); ad.close(); }
  // ---- pictures: played live (the clips run at their real speed), each 1/30 s frame stamped with its exact time
  const started = new Set(); let k = 0; const t0 = performance.now() + 300;
  await new Promise((done) => {
    const frame = () => {
      const t = (performance.now() - t0) / 1000;
      if (t >= 0) {
        g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
        draw(t, TL, vids, started);
        while (k / FPS <= t && k / FPS < total) { const vf = new VideoFrame(c, { timestamp: Math.round((k / FPS) * 1e6), duration: Math.round(1e6 / FPS) }); venc.encode(vf, { keyFrame: k % 60 === 0 }); vf.close(); k++; }
      } else { for (const s of TL.segments) if (s.src && !started.has(s) && s.t <= 0.2) { started.add(s); const v = vids[s.src]; v.currentTime = s.from ?? 0; v.play(); } }
      if (k / FPS < total) requestAnimationFrame(frame); else done();
    };
    requestAnimationFrame(frame);
  });
  await venc.flush(); await aenc.flush(); if (err) throw err; muxer.finalize();
  const buf = new Uint8Array(target.buffer); let s = '';
  for (let i = 0; i < buf.length; i += 32768) s += String.fromCharCode(...buf.subarray(i, i + 32768));
  return { mime: 'video/mp4', b64: btoa(s), seconds: total, frames: k, levels, peak };
};
// The page's own text over a game screen, from the recorder's log (promo-arcade.mjs: what the page showed, and when): the pool
// jackpot amount above, the WIN / POOL JACKPOT stamp over the screen (a jackpot stamp held at least 2.6 s: the next ball
// replaced it in 0.4 s), the run's "won $…" below. Times follow the clip's own playhead.
function gameText(s, v, x, y, w, h) {
  const now = v.currentTime, ev = s._log.events.filter((e) => e[0] <= now);
  // pool jackpot plaque
  g.save(); g.fillStyle = 'rgba(12,15,26,.88)'; g.strokeStyle = COL.lamp; g.lineWidth = 4; const py = y - 150; g.fillRect(x, py, w, 120); g.strokeRect(x, py, w, 120);
  g.restore(); text('POOL JACKPOT', x + 30, py + 60, { font: 'pixel', size: 40, weight: 700, color: COL.text, align: 'left', shadow: false });
  text(s._log.jackpot, x + w - 30, py + 62, { font: 'pixel', size: 66, weight: 700, color: COL.lamp, align: 'right', shadow: false });
  // won bar
  const won = ev.filter((e) => e[1] === 'won').at(-1)?.[2] || ''; g.save(); g.fillStyle = 'rgba(12,15,26,.88)'; g.fillRect(x, y + h + 24, w, 96); g.restore();
  text('THIS RUN', x + 30, y + h + 72, { font: 'pixel', size: 36, weight: 700, color: COL.frost, align: 'left', shadow: false });
  text(won, x + w - 30, y + h + 72, { font: 'pixel', size: 44, weight: 700, color: COL.lamp, align: 'right', shadow: false });
  // stamp: the newest one, but a jackpot holds the screen for 2.6 s
  const stamps = ev.filter((e) => e[1] === 'stamp'), jp = stamps.filter((e) => e[3] && e[2]).at(-1);
  let st = stamps.at(-1); if (jp && now - jp[0] < 2.6) st = jp;
  if (st && st[2]) { const age = now - st[0], k = Math.min(1, age / 0.18), big = st[3];
    g.save(); g.translate(x + w / 2, y + h * (big ? 0.42 : 0.16)); g.rotate(-0.07); g.scale(1.6 - 0.6 * ease(k), 1.6 - 0.6 * ease(k)); g.globalAlpha *= Math.min(1, age / 0.1);
    if (big) { g.fillStyle = 'rgba(255,190,92,.25)'; g.beginPath(); g.ellipse(0, 0, w * 0.55, 150, 0, 0, Math.PI * 2); g.fill(); }
    const lines = big ? st[2].replace(/^POOL JACKPOT /, 'POOL JACKPOT\n').split('\n') : [st[2]];
    lines.forEach((ln, i) => text(ln, 0, (i - (lines.length - 1) / 2) * (big ? 120 : 0), { size: big ? 128 : 92, color: big ? COL.lamp : COL.brim, stroke: 12 }));
    g.restore(); }
}
function draw(t, TL, vids, started) {
  for (const s of TL.segments) {
    if (t < s.t - 0.6 || t > s.t + s.dur) continue;
    if (s.src || s.img) { const v = vids[s.src || s.img], vw = v.videoWidth || v.naturalWidth, vh = v.videoHeight || v.naturalHeight;
